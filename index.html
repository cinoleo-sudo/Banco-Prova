:root{
  --bg:#0f0f1e;
  --surface:#17172a;
  --surface2:#1d1d35;
  --line:#2d2d4d;
  --muted:#a9a9c3;
  --text:#f7f3e8;
  --gold:#FFC107;
  --gold2:#ffda52;
  --danger:#ff5d6c;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f1e6;
    --surface:#ffffff;
    --surface2:#fff7d7;
    --line:#e3d9aa;
    --muted:#5c5a68;
    --text:#17172a;
    --gold:#e9a800;
    --gold2:#f7bd00;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
}

button,select{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  background:var(--bg);
  padding:var(--safe-area-inset-top) 0 0
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:rgba(15,15,30,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px max(18px,calc((100vw - 1180px)/2));
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0
}

.logo{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:11px;
  background:var(--gold);
  color:#111;
  display:grid;
  place-items:center;
  font-weight:1000;
  font-size:30px;
  line-height:1;
  box-shadow:0 0 0 2px #111, 0 0 0 4px var(--gold)
}

.kicker{
  font-size:11px;
  letter-spacing:.16em;
  font-weight:800;
  color:var(--gold);
  margin:0 0 3px
}

.brand h1{
  font-size:24px;
  line-height:1;
  margin:0;
  letter-spacing:-.03em
}

.header-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.btn{
  border:0;
  border-radius:999px;
  padding:10px 16px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-weight:800;
  font-size:13px
}

.btn.gold{
  background:var(--gold);
  color:#111
}

.btn.ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line)
}

main{
  max-width:1180px;
  margin:0 auto;
  padding:24px 18px 40px
}

.hero{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:20px;
  align-items:stretch;
  margin-bottom:14px
}

.hero>div:first-child{
  padding:28px 8px
}

.update{
  font-size:12px;
  letter-spacing:.12em;
  color:var(--muted);
  margin:0 0 16px
}

.hero h2{
  font-size:clamp(48px,7vw,76px);
  line-height:.82;
  letter-spacing:-.06em;
  margin:0
}

.big-number{
  color:var(--gold);
  font-size:1.18em
}

.hero-sub{
  max-width:520px;
  color:var(--muted);
  font-size:17px;
  line-height:1.55;
  margin:22px 0
}

.hero-stats{
  display:flex;
  gap:34px;
  border-top:1px solid var(--line);
  padding-top:16px
}

.hero-stats div{
  display:flex;
  align-items:baseline;
  gap:8px
}

.hero-stats b{
  font-size:27px;
  color:var(--gold)
}

.hero-stats span{
  font-size:11px;
  letter-spacing:.14em;
  font-weight:800;
  color:var(--muted)
}

.hero-card{
  background:var(--gold);
  color:#151515;
  border-radius:22px;
  padding:24px;
  position:relative;
  overflow:hidden
}

.hero-card:after{
  content:"B";
  position:absolute;
  right:-12px;
  bottom:-48px;
  font-size:180px;
  font-weight:1000;
  opacity:.08;
  line-height:1
}

.verify{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.13em
}

.hero-card h3{
  font-size:35px;
  line-height:.95;
  letter-spacing:-.04em;
  margin:24px 0 12px
}

.hero-card p{
  font-size:14px;
  line-height:1.5;
  margin:0
}

.hero-note{
  border-top:1px solid rgba(0,0,0,.18);
  margin-top:18px;
  padding-top:14px;
  font-weight:800;
  font-size:12px
}

.status{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 15px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:18px;
  display:flex;
  gap:9px;
  align-items:center
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4ad47f;
  flex:0 0 8px;
  box-shadow:0 0 0 5px rgba(74,212,127,.14)
}

.sim-panel{
  border:1px dashed var(--gold);
  background:#241f0a;
  border-radius:18px;
  padding:18px;
  margin-bottom:22px
}

.sim-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start
}

.sim-head h2{
  margin:0;
  font-size:24px
}

.sim-head p{
  color:#ddd4a8;
  font-size:13px;
  margin:5px 0 0
}

.sim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 24px;
  margin-top:18px
}

.sim-row,.draw-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.sim-row b,.draw-row .wheel{
  width:92px;
  font-size:13px
}

.balls{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.ball{
  width:36px;
  height:36px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--gold);
  color:#111;
  font-weight:900;
  font-size:13px;
  border:2px solid #111;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)
}

.ball-muted{
  background:#55566d;
  color:#ddd
}

.sim-result{
  margin-top:16px;
  background:#111;
  color:#fff;
  padding:12px 14px;
  border-radius:10px;
  font-size:13px;
  font-weight:700
}

.sim-result.hit{
  color:var(--gold)
}

section{
  margin-bottom:34px
}

.extraction{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:18px;
  margin-bottom:18px
}

.section-head h2{
  font-size:clamp(26px,4vw,38px);
  line-height:1;
  margin:0;
  letter-spacing:-.03em
}

.section-head h2 span{
  color:var(--gold)
}

.pill{
  background:var(--gold);
  color:#111;
  border-radius:999px;
  padding:7px 12px;
  font-weight:900;
  font-size:11px;
  letter-spacing:.08em
}

.pill.muted{
  background:#3a3a50;
  color:#c8c8da
}

.draw-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px 42px
}

.draw-row{
  padding:10px 0;
  border-bottom:1px solid var(--line)
}

.ext-foot{
  margin:16px 0 0;
  color:var(--muted);
  font-size:13px
}

.new-section{
  border:2px solid var(--gold);
  border-radius:22px;
  padding:22px;
  background:linear-gradient(180deg, rgba(255,193,7,.10), transparent 55%)
}

.new-pill{
  background:var(--gold);
  color:#111;
  border-radius:999px;
  padding:8px 12px;
  display:inline-flex;
  gap:6px;
  align-items:center;
  font-weight:900;
  font-size:12px
}

.new-grid,.cards-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px
}

.tech-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  position:relative
}

.tech-card.is-new{
  border-color:rgba(255,193,7,.65);
  box-shadow:0 0 0 1px rgba(255,193,7,.18)
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start
}

.eyebrow{
  font-size:11px;
  letter-spacing:.12em;
  font-weight:800;
  color:var(--muted)
}

.eyebrow .num{
  color:var(--gold);
  margin-right:7px
}

.card-top h3{
  font-size:26px;
  margin:5px 0 0
}

.badges{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px
}

.badge-new{
  background:var(--gold);
  color:#111;
  border-radius:999px;
  padding:5px 8px;
  font-size:11px;
  font-weight:1000;
  display:flex;
  align-items:center;
  gap:4px
}

.urgency{
  font-size:10px;
  font-weight:900;
  letter-spacing:.08em;
  color:var(--muted)
}

.urgency.hot{
  color:var(--danger)
}

.ambo-row{
  display:flex;
  gap:34px;
  margin:20px 0 16px;
  padding:14px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)
}

.label{
  display:block;
  font-size:10px;
  letter-spacing:.16em;
  color:var(--muted);
  font-weight:800;
  margin-bottom:5px
}

.ambo{
  font-size:23px;
  color:var(--gold)
}

.terno{
  font-size:19px
}

.heat-head{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  gap:10px
}

.heat-head>span{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--gold);
  font-weight:800
}

.bar{
  height:9px;
  background:#302f46;
  border-radius:99px;
  overflow:hidden;
  margin:8px 0
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#ff9d00,var(--gold),#fff07a);
  border-radius:99px
}

.heat-foot{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  color:var(--muted);
  flex-wrap:wrap
}

.heat-foot b{
  color:var(--text)
}

.cond{
  display:flex;
  align-items:center;
  gap:8px;
  background:#2b2408;
  border:1px solid rgba(255,193,7,.35);
  color:#ffe98c;
  border-radius:10px;
  padding:10px 11px;
  font-size:12px;
  margin-top:14px
}

.cond strong{
  letter-spacing:.04em
}

.schedine{
  margin-top:16px
}

.schedine-title{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  letter-spacing:.12em;
  font-weight:900;
  color:var(--muted);
  margin-bottom:9px
}

.schedina{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:8px 0;
  border-top:1px dashed var(--line);
  font-size:13px
}

.schedina>span{
  width:24px;
  height:24px;
  flex:0 0 24px;
  border-radius:50%;
  background:var(--gold);
  color:#111;
  display:grid;
  place-items:center;
  font-weight:1000;
  font-size:12px
}

.schedina p{
  margin:2px 0;
  line-height:1.45
}

.no-schedina{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
  margin:0
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:end
}

.select-wrap{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:5px
}

.select-wrap span{
  font-size:11px;
  color:var(--muted);
  font-weight:700
}

.select-wrap select{
  -webkit-appearance:none;
     -moz-appearance:none;
          appearance:none;
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 32px 10px 12px;
  min-width:170px
}

.select-wrap svg{
  position:absolute;
  right:10px;
  bottom:12px;
  pointer-events:none;
  color:var(--muted)
}

.toggle{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:10px;
  padding:10px 12px;
  font-weight:800;
  font-size:12px
}

.toggle.on{
  background:var(--gold);
  color:#111;
  border-color:var(--gold)
}

.result-count{
  color:var(--muted);
  font-size:13px;
  margin:-6px 0 14px
}

.result-count strong{
  color:var(--gold)
}

.empty{
  background:var(--surface);
  border:1px dashed var(--line);
  border-radius:14px;
  padding:24px;
  text-align:center;
  color:var(--muted)
}

.empty button{
  border:0;
  background:var(--gold);
  color:#111;
  border-radius:999px;
  padding:9px 14px;
  font-weight:800;
  margin-left:8px
}

.archive{
  background:#15151f;
  border:1px solid #2a2a39;
  border-radius:20px;
  padding:22px
}

.archive-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.archive-card{
  background:#1b1b28;
  border:1px solid #2b2b3a;
  border-radius:14px;
  padding:18px;
  filter:grayscale(.25);
  opacity:.88
}

.archive-top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.archive-top h3{
  margin:0;
  font-size:22px
}

.expired-badge{
  background:#55566d;
  color:#fff;
  border-radius:999px;
  padding:6px 9px;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:900
}

.archive-ambo{
  font-size:13px;
  color:#aaa;
  margin:18px 0 4px
}

.archive-ambo strong{
  font-size:22px;
  color:#ddd;
  margin-left:6px
}

.archive-terno{
  color:#999;
  font-size:13px;
  margin:0
}

.archive-colpo{
  color:#f08d96;
  font-weight:800;
  font-size:12px;
  margin:16px 0 0
}

.archive-note{
  color:#888;
  font-size:12px;
  margin:14px 0 0
}

footer{
  max-width:1180px;
  margin:0 auto;
  padding:24px 18px 36px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  align-items:center
}

footer>div{
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:12px;
  letter-spacing:.08em
}

footer strong{
  color:var(--gold)
}

footer span{
  color:var(--muted);
  letter-spacing:.03em
}

footer .next{
  flex-direction:row;
  align-items:center;
  gap:7px
}

footer p{
  width:100%;
  color:var(--muted);
  font-size:12px;
  margin:0
}

@media (max-width:720px){
  .topbar{
    align-items:flex-start;
    padding:12px 14px
  }

  .brand h1{
    font-size:19px
  }

  .logo{
    width:38px;
    height:38px;
    font-size:26px
  }

  .header-actions{
    width:100%;
    order:3
  }

  .topbar{
    flex-wrap:wrap
  }

  .btn{
    flex:1;
    justify-content:center;
    padding:10px 8px;
    font-size:12px
  }

  main{
    padding:18px 12px 28px
  }

  .hero{
    grid-template-columns:1fr;
    gap:8px
  }

  .hero>div:first-child{
    padding:18px 2px 8px
  }

  .hero h2{
    font-size:56px
  }

  .hero-stats{
    gap:22px;
    flex-wrap:wrap
  }

  .hero-card{
    padding:20px
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column
  }

  .section-head.wrap .controls{
    width:100%
  }

  .select-wrap{
    flex:1
  }

  .select-wrap select{
    min-width:0;
    width:100%
  }

  .toggle{
    flex:1
  }

  .draw-grid,.new-grid,.cards-grid,.archive-grid,.sim-grid{
    grid-template-columns:1fr
  }

  .extraction,.new-section,.archive{
    padding:16px
  }

  .draw-row{
    padding:8px 0
  }

  .ball{
    width:33px;
    height:33px
  }

  .sim-head{
    flex-direction:column
  }

  .sim-head .btn{
    width:100%;
    justify-content:center
  }

  .ambo-row{
    gap:20px;
    flex-wrap:wrap
  }

  .card-top{
    align-items:flex-start
  }

  footer{
    flex-direction:column;
    align-items:flex-start
  }
}

@media (prefers-color-scheme: light){
  .topbar{
    background:rgba(244,241,230,.94)
  }

  .sim-panel{
    background:#fff7d7
  }

  .sim-panel p{
    color:#5d551d
  }

  .sim-result{
    background:#17172a
  }

  .archive{
    background:#e9e9ee
  }

  .archive-card{
    background:#f7f7f9
  }

  .bar{
    background:#e4ddbd
  }
}
